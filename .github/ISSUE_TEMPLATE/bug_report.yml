name: 🐛 Bug 报告
description: 提交一个 Bug 报告
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量填写完整信息，以便快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰描述遇到了什么问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 描述如何复现这个问题
      placeholder: |
        1. 打开应用
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生的行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生的行为
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 如 Mate 60 Pro / Mate X5 / 平板等
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 如 1.2.0
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: 使用的 AI 模型
      options:
        - DeepSeek
        - 智谱 GLM
        - 百度文心
        - 小艺助手
        - 本地 GGUF
        - 自定义接口
        - 未使用 AI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 如有相关日志或截图，请粘贴
