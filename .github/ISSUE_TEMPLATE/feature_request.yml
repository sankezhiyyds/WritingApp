name: ✨ 功能请求
description: 提出一个新功能建议
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请尽量描述清楚需求和使用场景。
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰描述你想要的功能
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么场景下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 如果有实现思路，请描述
  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      options:
        - 创作功能
        - AI 集成
        - UI/UX
        - 多端适配
        - 性能优化
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意为此功能提交 PR
          required: false
